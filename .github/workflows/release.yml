name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or update a GitHub Release for (e.g. v1.3.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Sync GitHub Release & Build OTA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 for frontend static bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend static bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build OTA package & publish GitHub Release with SHA-256 assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib, io, json, os, pathlib, re, tarfile, urllib.error, urllib.parse, urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          tag = os.environ["TARGET_TAG"].strip()
          if not tag.startswith("v"):
              tag = f"v{tag}"
          ver = tag.lstrip("vV")

          # Build OTA archive using pure Python stdlib (zero third-party pip deps required)
          project_root = pathlib.Path(".")
          pkg_dir = project_root / "backend" / "src" / "opentradeledger"
          dist_dir = project_root / "web" / "dist"
          assert (pkg_dir / "__init__.py").is_file(), f"Missing {pkg_dir / '__init__.py'}"
          assert (dist_dir / "index.html").is_file(), f"Missing {dist_dir / 'index.html'}"

          out_dir = pathlib.Path("dist-ota")
          out_dir.mkdir(parents=True, exist_ok=True)
          tar_path = out_dir / "opentradeledger-ota.tar.gz"
          sha_path = out_dir / "opentradeledger-ota.sha256"

          manifest = {
              "version": ver,
              "tag": tag,
              "min_base_version": "1.3.0",
              "built_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          manifest_bytes = json.dumps(manifest, indent=2, ensure_ascii=False).encode("utf-8")

          with tarfile.open(tar_path, mode="w:gz") as tf:
              m_info = tarfile.TarInfo(name="manifest.json")
              m_info.size = len(manifest_bytes)
              m_info.mode = 0o644
              tf.addfile(m_info, io.BytesIO(manifest_bytes))

              for path in sorted(pkg_dir.rglob("*")):
                  if "__pycache__" in path.parts or path.name.endswith((".pyc", ".pyo")) or path.name == ".DS_Store":
                      continue
                  if path.is_file():
                      rel = path.relative_to(project_root).as_posix()
                      tf.add(path, arcname=rel, recursive=False)

              for path in sorted(dist_dir.rglob("*")):
                  if path.name == ".DS_Store":
                      continue
                  if path.is_file():
                      rel = path.relative_to(project_root).as_posix()
                      tf.add(path, arcname=rel, recursive=False)

          sha_hex = hashlib.sha256(tar_path.read_bytes()).hexdigest().lower()
          sha_path.write_text(f"{sha_hex}  opentradeledger-ota.tar.gz\n", encoding="utf-8")
          print(f"Built OTA bundle: {tar_path} ({tar_path.stat().st_size} bytes), sha256={sha_hex}")

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8") if pathlib.Path("CHANGELOG.md").exists() else ""
          m = re.search(
              rf"^## \[{re.escape(tag)}\]\s*(?:—|-)\s*(.+?)\n(.*?)(?=^## \[v|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if m:
              title = f"{tag} — {m.group(1).strip()}"
              body = m.group(2).strip().rstrip("-").strip()
          else:
              title = f"OpenTradeLedger {tag}"
              body = f"Release {tag}"

          full_body = f"{body}\n\n---\nOTA-SHA256: `{sha_hex}`"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "OpenTradeLedger-Release-Sync",
          }

          payload = json.dumps(
              {
                  "tag_name": tag,
                  "name": title,
                  "body": full_body,
                  "draft": False,
                  "prerelease": "-" in tag,
                  "make_latest": "false" if "-" in tag else "true",
              }
          ).encode("utf-8")

          existing_id = None
          try:
              req_get = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
                  headers=headers,
                  method="GET",
              )
              with urllib.request.urlopen(req_get, timeout=20) as resp:
                  existing_id = json.loads(resp.read().decode("utf-8")).get("id")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          if existing_id:
              url = f"https://api.github.com/repos/{repo}/releases/{existing_id}"
              method = "PATCH"
          else:
              url = f"https://api.github.com/repos/{repo}/releases"
              method = "POST"

          req_out = urllib.request.Request(url, data=payload, headers=headers, method=method)
          with urllib.request.urlopen(req_out, timeout=20) as resp:
              out = json.loads(resp.read().decode("utf-8"))
              release_id = out["id"]
              print("Synced release:", out.get("name"), out.get("html_url"))

          req_assets = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/{release_id}/assets",
              headers=headers,
              method="GET",
          )
          with urllib.request.urlopen(req_assets, timeout=20) as resp:
              cur_assets = json.loads(resp.read().decode("utf-8"))

          upload_targets = [(tar_path, "application/gzip"), (sha_path, "text/plain; charset=utf-8")]
          demo_mp4 = pathlib.Path("docs/demo/opentradeledger-demo.mp4")
          if demo_mp4.is_file():
              upload_targets.append((demo_mp4, "video/mp4"))

          for asset_file, ctype in upload_targets:
              for existing_asset in cur_assets:
                  if existing_asset.get("name") == asset_file.name:
                      del_req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/releases/assets/{existing_asset['id']}",
                          headers=headers,
                          method="DELETE",
                      )
                      with urllib.request.urlopen(del_req, timeout=20):
                          pass
              up_url = (
                  f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?"
                  + urllib.parse.urlencode({"name": asset_file.name})
              )
              up_headers = {
                  **headers,
                  "Content-Type": ctype,
              }
              up_req = urllib.request.Request(
                  up_url,
                  data=asset_file.read_bytes(),
                  headers=up_headers,
                  method="POST",
              )
              with urllib.request.urlopen(up_req, timeout=60) as resp:
                  uploaded = json.loads(resp.read().decode("utf-8"))
                  print("Uploaded asset:", uploaded.get("name"), uploaded.get("browser_download_url"))
          PY
